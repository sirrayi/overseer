name: bench

# Benchmark campaign workers — the 50k-minute GitHub substrate for the
# Oct-1 eval matrix. Dispatch-only: nothing runs on push/PR.
#
#   gh workflow run bench.yml -f only=sweb-muse -f max=6
#
# Each worker job resolves its slice from eval/cloud/driver.py
# matrix-json, builds overseer once, runs the spec commands in eval/,
# and uploads results + stress output as artifacts named results-<run>.
# OPENCODE_API_KEY comes from repo Actions secrets — never in logs.

on:
  workflow_dispatch:
    inputs:
      only:
        description: run-prefix filter (e.g. sweb-muse, tb2, stress, poly)
        default: ""
      max:
        description: cap worker jobs (0 = all)
        default: "0"
      ref:
        description: branch/SHA to benchmark (default = this branch)
        default: ""

concurrency:
  group: bench-${{ github.workflow }}-${{ github.event.inputs.only || 'all' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.gen.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v5
      - id: gen
        run: |
          cd eval
          SPECS=$(python3 cloud/driver.py matrix-json \
                  --only "${{ github.event.inputs.only }}" \
                  --max "${{ github.event.inputs.max }}")
          echo "specs=$SPECS" >> "$GITHUB_OUTPUT"
          echo "$SPECS" | python3 -m json.tool | head -40

  worker:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.specs) }}
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OVERSEER_PROVIDER: opencode
      OVERSEER_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OVERSEER_MODEL: ${{ matrix.model }}
      OVERSEER_BIN: ${{ github.workspace }}/target/release/overseer
      OVERSEER_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5

      - name: build overseer
        run: cargo build --release -p overseer-cli

      - name: eval deps
        working-directory: eval
        run: uv sync

      - name: run slice — ${{ matrix.run }}
        working-directory: eval
        run: ${{ matrix.cmd }}

      - name: results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.run }}
          path: |
            eval/results/
            eval/stress/out/
            eval/workspaces/*/trajectory.jsonl
          if-no-files-found: warn
          retention-days: 90
