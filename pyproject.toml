[project]
name = "overseer"
version = "0.1.0"
description = "Vault-native, self-improving, verification-driven agent harness. The overseer. Under the hood, the engine. Everything."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sirrayi" }]
keywords = ["agent", "harness", "vault", "memory", "cli", "self-improving"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
overseer = "overseer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overseer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "C4"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# vault.py holds markdown template strings; E501/W291 apply to rendered content.
"src/overseer/vault.py" = ["E501", "W291"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
