[workspace]
resolver = "2"
members = [
    "crates/overseer-core",
    "crates/overseer-cli",
    "crates/overseer-proto",
    "crates/overseer-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Lean-by-default release profile (playbook Ch.10): small, stripped, fully optimized.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
