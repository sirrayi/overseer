[package]
name = "overseer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Overseer CLI: headless exec/JSONL mode first, TUI later"
repository = "https://github.com/sirrayi/overseer"
homepage = "https://github.com/sirrayi/overseer"

[[bin]]
name = "overseer"
path = "src/main.rs"

[dependencies]
overseer-core = { path = "../overseer-core", version = "0.1.0" }
overseer-gateway = { path = "../overseer-gateway", version = "0.1.0" }
overseer-tui = { path = "../overseer-tui", version = "0.1.0" }
serde_json = "1"
