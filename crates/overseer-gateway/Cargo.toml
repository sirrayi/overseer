[package]
name = "overseer-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Overseer gateway daemon (playbook 12.7 §5.1-5.3): trigger bus, intervention gate, agent inbox"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
# Same spec as overseer-core (R1-F1): the channel clients speak HTTP
# through it, so the workspace gains no package — only a reuse edge.
ureq = { version = "3", default-features = false, features = ["rustls", "json", "platform-verifier"] }
# Unix-only crate: the ctl socket is std::os::unix::net and every dist
# target is unix.
libc = "0.2"
