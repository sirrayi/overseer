<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>overseer</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#1e1f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div id="win">
  <div id="bar">
    <span class="dot r"></span>
    <span class="dot y"></span>
    <span class="dot g"></span>
    <span id="title">overseer</span>
  </div>
  <div id="screen" tabindex="0"><div id="empty"><span id="emark"></span></div></div>
  <button id="mark" type="button" aria-label="open panel"></button>
</div>
<div id="bye">session ended</div>
<div id="lock"><span id="lockmark"></span><span id="lockmsg">Run <code>overseer web</code> — it opens this page with your key.</span></div>
<script src="/app.js"></script>
</body>
</html>
