[package]
name = "overseer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Overseer agent engine: turn IR, event log, ledger, tools, provider adapters, ReAct loop"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json", "platform-verifier"] }
ignore = "0.4"
globset = "0.4"
regex-lite = "0.1"
sha2 = "0.10"
# threat::scan decodes base64-looking runs to catch encoded payloads
# (memory-v3 B-base64). Version pinned to ureq's — one base64 in the
# lock tree (cargo-deny bans duplicates).
base64 = "0.23"
# QuickJS for `run_code` (code-mode). No `std`/`loader`/`dyn-load`: the
# engine gets no filesystem, OS, module or native-library access.
rquickjs = { version = "=0.13.0", default-features = false, optional = true }

[features]
default = ["code-mode"]
code-mode = ["dep:rquickjs"]
