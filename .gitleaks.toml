# Gitleaks config for overseer.
# Test files intentionally contain FAKE secret-shaped strings to verify
# redaction and provider auth handling. They are not real secrets —
# allowlist the test files.

[extend]
useDefault = true

[allowlist]
paths = [
  '''tests/test_redact.py''',
  '''tests/test_providers.py''',
  '''tests/test_tools.py''',
  '''tests/test_agent.py''',
  '''tests/test_logging.py''',
]
